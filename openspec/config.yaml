schema: spec-driven

context: |
  Project: gitcg-netcord (Discord Bot for Genshin Impact Genius Invokation TCG).
  Stack: .NET 10, C# 13, .NET Aspire 13.6, NetCord (1.0.0-beta.29), SkiaSharp, EF Core (PostgreSQL), Redis.
  User Interface Language: ALL user-facing Discord elements (commands, parameter descriptions, embed titles/fields/footers, notices, error messages) MUST be written in English.
  Graphics Safety: Strictly ensure all SkiaSharp native objects (SKBitmap, SKCanvas, SKImage, SKPaint) are properly disposed.
  Git Conventions: Use Conventional Commits (feat, fix, refactor, docs) adhering to project history.

rules:
  proposal:
    - "Assess SemVer impact (MAJOR/MINOR/PATCH) and state breaking changes explicitly"
    - "Always define explicit In-Scope and Out-of-Scope boundaries"
    - "Identify any new infrastructure requirements (databases, caches, Aspire AppHost resources)"
  specs:
    - "Requirements must use RFC 2119 keywords (SHALL, MUST, SHOULD)"
    - "Every requirement MUST include testable scenarios using GIVEN/WHEN/THEN format"
    - "Scenarios must explicitly verify permission restrictions (ManageChannels, Guild-only, Thread owner) and edge cases"
    - "Reiterate that all user-facing responses in scenarios must be rendered in English"
  design:
    - "Use Context7 MCP to verify current library APIs (NetCord, Aspire, SkiaSharp, SemanticKernel) before proposing code structures"
    - "Separate architectural layers: Domain models, Service/Rendering logic, and NetCord command modules"
    - "When adding dependencies or services, define their integration within the Aspire AppHost and ServiceDefaults"
    - "Detail SkiaSharp canvas allocation and image stream lifetimes to prevent native memory leaks"
  tasks:
    - "Order implementation: Models/Migrations -> Aspire AppHost Wiring -> Core/Skia Logic -> NetCord Handlers/Endpoints -> Unit Tests"
    - "Keep tasks small, testable, and independently verifiable"
    - "Always include an explicit task for running and passing `dotnet test`"

operations:
  apply:
    guidance:
      - "Consult Context7 MCP if encountering unexpected library behavior or unfamiliar API signatures"
      - "Aspire Process Ownership: NEVER run `aspire stop` (which terminates developer's interactive session/dashboard) and NEVER run `aspire start` (which creates unmanageable detached background daemons). The developer owns the Aspire AppHost lifecycle."
      - "Session-Level Aspire Resource Lifecycle: If Aspire is active (`aspire ps`), proactively stop the application resource once at the very beginning of the apply session using `aspire resource main stop`. Keep it stopped throughout task implementation and testing to eliminate Windows file-lock delays (MSB3491/CS2012) and avoid Discord gateway reconnect churn. When all tasks are complete (or when implementation pauses), restart the resource once using `aspire resource main start`."
      - "Scoped Testing: Prefer scoping `dotnet test` to the target test project (e.g., `dotnet test tests/GitcgNetCord.MainApp.Tests/GitcgNetCord.MainApp.Tests.csproj`) rather than running solution-wide tests."
      - "Utilize Aspire CLI (`aspire ps`, `aspire describe`) or Aspire skills to inspect AppHost health, logs, and telemetry when verifying integration changes"
      - "Always run `dotnet test` and ensure all tests pass before completing tasks"
      - "Check for proper IDisposable usage on all SkiaSharp resources"
  archive:
    guidance:
      - "Verify all delta specs synced cleanly into openspec/specs/"
      - "Ensure no lingering temporary build logs (e.g., msbuild.binlog) or uncommitted scratch files remain"
